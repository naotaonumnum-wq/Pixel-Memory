name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q PixelMemory-Android-online.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/memory_app :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMemory-APK
          path: extracted/memory_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
